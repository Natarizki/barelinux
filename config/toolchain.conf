# BareLinux MLFS cross-toolchain policy
# Triplets and sysroot layout are bound to the MLFS 13.1 book in the build stage.
TOOLCHAIN_MODEL=mlfs-cross
PRIMARY_ABI=x86_64
SECONDARY_ABI=i686
MULTILIB_MODE=full
SYSROOT_ROOT=work/sysroot
TOOLCHAIN_PREFIX=work/cross-tools
BUILD_JOBS=auto
BUILD_ISOLATION=ephemeral-archlinux-container
