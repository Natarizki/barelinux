name: Build GCC Pass 1

on:
  workflow_run:
    workflows: ["Build Binutils Pass 1"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      binutils_run_id:
        description: "Successful Build Binutils Pass 1 workflow run ID"
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  gcc-pass1:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    name: Build GCC Pass 1 from generated raw MLFS recipe
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out BareLinux
        uses: actions/checkout@v4

      - name: Install MLFS and ALFS host prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends build-essential bison flex texinfo python3 curl xz-utils ca-certificates file git xsltproc libxml2-utils docbook-xml docbook-xsl util-linux

      - name: Validate build script syntax
        run: |
          bash -n scripts/build-gcc-pass1-alfs.sh
          bash -n scripts/validate-alfs-mlfs-sources.sh

      - name: Resolve successful Binutils workflow run
        id: binutils
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          RUN_ID="${{ github.event.workflow_run.id || inputs.binutils_run_id }}"
          if [[ -z "$RUN_ID" ]]; then
            RUN_ID="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/build-binutils-pass1.yml/runs?status=success&per_page=20" --jq '.workflow_runs[] | select(.conclusion == "success") | .id' | head -n 1)"
          fi
          [[ "$RUN_ID" =~ ^[0-9]+$ ]] || { echo "No successful Binutils Pass 1 run ID found" >&2; exit 1; }
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "Using successful Binutils Pass 1 run: $RUN_ID"

      - name: Download successful Binutils Pass 1 prerequisite
        uses: actions/download-artifact@v4
        with:
          name: barelinux-mlfs-13.1-binutils-pass1
          path: ${{ runner.temp }}/binutils-artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.binutils.outputs.run_id }}

      - name: Validate and install Binutils prerequisite
        run: |
          set -euo pipefail
          ARTIFACT="$RUNNER_TEMP/binutils-artifact"
          MARKER="$ARTIFACT/BUILD-SUCCESS"
          ARCHIVE="$ARTIFACT/binutils-pass1-build-root.tar.xz"
          HOME_ARCHIVE="$ARTIFACT/lfs-home.tar.xz"
          test -s "$MARKER"
          test -s "$ARCHIVE"
          test -s "$HOME_ARCHIVE"
          LFS_UID="$(awk -F= '$1=="lfs_uid" {print $2}' "$MARKER")"
          LFS_GID="$(awk -F= '$1=="lfs_gid" {print $2}' "$MARKER")"
          [[ "$LFS_UID" =~ ^[0-9]+$ && "$LFS_GID" =~ ^[0-9]+$ ]]
          grep -Fxq 'artifact_schema=2' "$MARKER"
          grep -Fxq 'stage=binutils-pass1' "$MARKER"
          grep -Fxq 'status=success' "$MARKER"
          MLFS_COMMIT="$(awk -F= '$1=="MLFS_COMMIT" {print $2}' sources/locks/alfs-mlfs.lock)"
          JHALFS_COMMIT="$(awk -F= '$1=="JHALFS_COMMIT" {print $2}' sources/locks/alfs-mlfs.lock)"
          grep -Fxq "mlfs_commit=$MLFS_COMMIT" "$MARKER"
          grep -Fxq "jhalfs_commit=$JHALFS_COMMIT" "$MARKER"
          python3 - "$ARCHIVE" <<'PY'
          import posixpath, sys, tarfile
          with tarfile.open(sys.argv[1], "r:xz") as tf:
              members = tf.getmembers()
              if not members:
                  raise SystemExit("empty Binutils artifact")
              for item in members:
                  name = item.name
                  if name.startswith("/") or any(p in ("", ".", "..") for p in name.split("/")[:-1]):
                      raise SystemExit(f"unsafe artifact path: {name!r}")
                  if name.split("/", 1)[0] != "target":
                      raise SystemExit(f"unexpected artifact root: {name!r}")
                  if item.issym() or item.islnk():
                      target = item.linkname
                      if target.startswith("/"):
                          raise SystemExit(f"absolute link rejected: {name!r}")
                      resolved = posixpath.normpath(posixpath.join(posixpath.dirname(name), target))
                      if resolved == ".." or resolved.startswith("../") or not resolved.startswith("target/"):
                          raise SystemExit(f"artifact link escapes target/: {name!r}")
                  elif not (item.isfile() or item.isdir()):
                      raise SystemExit(f"unsupported artifact member: {name!r}")
          PY
          python3 - "$HOME_ARCHIVE" <<'PY'
          import posixpath, sys, tarfile
          with tarfile.open(sys.argv[1], "r:xz") as tf:
              members = tf.getmembers()
              if not members:
                  raise SystemExit("empty LFS home artifact")
              for item in members:
                  name = item.name
                  if name.startswith("/") or any(p in ("", ".", "..") for p in name.split("/")[:-1]):
                      raise SystemExit(f"unsafe LFS home path: {name!r}")
                  if name.split("/", 1)[0] != "lfs":
                      raise SystemExit(f"unexpected LFS home root: {name!r}")
                  if item.issym() or item.islnk():
                      target = item.linkname
                      if target.startswith("/"):
                          raise SystemExit(f"absolute LFS home link rejected: {name!r}")
                      resolved = posixpath.normpath(posixpath.join(posixpath.dirname(name), target))
                      if resolved == ".." or resolved.startswith("../") or not resolved.startswith("lfs/"):
                          raise SystemExit(f"LFS home link escapes lfs/: {name!r}")
                  elif not (item.isfile() or item.isdir()):
                      raise SystemExit(f"unsupported LFS home member: {name!r}")
          PY
          mkdir -p "$RUNNER_TEMP/barelinux-mlfs"
          sudo tar --same-owner -xJf "$ARCHIVE" -C "$RUNNER_TEMP/barelinux-mlfs"
          test -x "$RUNNER_TEMP/barelinux-mlfs/target/tools/x86_64-lfs-linux-gnu/bin/ld"
          test -x "$RUNNER_TEMP/barelinux-mlfs/target/tools/x86_64-lfs-linux-gnu/bin/as"

      - name: Generate and execute ALFS GCC Pass 1 recipe
        env:
          BLF_BUILD_JOBS: "2"
          LFS_HOME_ARCHIVE: ${{ runner.temp }}/binutils-artifact/lfs-home.tar.xz
        run: |
          bash scripts/build-gcc-pass1-alfs.sh "$RUNNER_TEMP/barelinux-mlfs"

      - name: Package verified tool prefix
        if: success()
        run: |
          tar -C "$RUNNER_TEMP/barelinux-mlfs" -cJf "$RUNNER_TEMP/gcc-pass1-build-root.tar.xz" target
          sudo tar -C /home -cJf "$RUNNER_TEMP/lfs-home.tar.xz" lfs
          cp "$RUNNER_TEMP/barelinux-mlfs/target/build/mlfs-13.1/gcc-pass1/BUILD-SUCCESS" "$RUNNER_TEMP/"

      - name: Upload verified GCC Pass 1 artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: barelinux-mlfs-13.1-gcc-pass1
          path: |
            ${{ runner.temp }}/gcc-pass1-build-root.tar.xz
            ${{ runner.temp }}/lfs-home.tar.xz
            ${{ runner.temp }}/BUILD-SUCCESS
          if-no-files-found: error
          retention-days: 14

      - name: Upload build and generated-recipe logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: barelinux-mlfs-gcc-pass1-alfs-logs
          path: |
            ${{ runner.temp }}/barelinux-mlfs/target/build/mlfs-13.1/gcc-pass1/*.log
            ${{ runner.temp }}/barelinux-mlfs/alfs/audit/REPORT.txt
            ${{ runner.temp }}/barelinux-mlfs/alfs/audit/generated-command-inventory.txt
          if-no-files-found: ignore
          retention-days: 7
