name: Build Binutils Pass 1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/build-binutils-pass1-alfs.sh"
      - "scripts/validate-alfs-mlfs-sources.sh"
      - "sources/locks/alfs-mlfs.lock"
      - "sources/manifests/mlfs-13.1-toolchain.tsv"
      - ".github/workflows/build-binutils-pass1.yml"

permissions:
  contents: read

jobs:
  binutils-pass1:
    name: Build Binutils Pass 1 from generated raw MLFS recipe
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out BareLinux
        uses: actions/checkout@v4

      - name: Install MLFS and ALFS host prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends build-essential bison flex texinfo python3 curl xz-utils ca-certificates file git xsltproc libxml2-utils docbook-xml docbook-xsl util-linux

      - name: Validate build script syntax
        run: |
          bash -n scripts/build-binutils-pass1-alfs.sh
          bash -n scripts/validate-alfs-mlfs-sources.sh

      - name: Generate and execute ALFS Binutils Pass 1 recipe
        env:
          BLF_BUILD_JOBS: "2"
        run: |
          mkdir -p "$RUNNER_TEMP/barelinux-mlfs"
          bash scripts/build-binutils-pass1-alfs.sh "$RUNNER_TEMP/barelinux-mlfs"

      - name: Package verified tool prefix
        if: success()
        run: |
          tar -C "$RUNNER_TEMP/barelinux-mlfs" -cJf "$RUNNER_TEMP/binutils-pass1-build-root.tar.xz" target
          sudo tar -C /home -cJf "$RUNNER_TEMP/lfs-home.tar.xz" lfs
          cp "$RUNNER_TEMP/barelinux-mlfs/target/build/mlfs-13.1/binutils-pass1/BUILD-SUCCESS" "$RUNNER_TEMP/"

      - name: Upload verified Binutils Pass 1 artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: barelinux-mlfs-13.1-binutils-pass1
          path: |
            ${{ runner.temp }}/binutils-pass1-build-root.tar.xz
            ${{ runner.temp }}/lfs-home.tar.xz
            ${{ runner.temp }}/BUILD-SUCCESS
          if-no-files-found: error
          retention-days: 14

      - name: Upload build and generated-recipe logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: barelinux-mlfs-binutils-pass1-alfs-logs
          path: |
            ${{ runner.temp }}/barelinux-mlfs/target/build/mlfs-13.1/binutils-pass1/*.log
            ${{ runner.temp }}/barelinux-mlfs/alfs/audit/REPORT.txt
            ${{ runner.temp }}/barelinux-mlfs/alfs/audit/generated-command-inventory.txt
          if-no-files-found: ignore
          retention-days: 7
