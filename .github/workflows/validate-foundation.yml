name: Validate BareLinux Foundation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate architecture, toolchain policy, and source gate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate shell syntax
        run: |
          bash -n scripts/check-config.sh
          bash -n scripts/check-sources.sh
          bash -n scripts/fetch-sources.sh
          bash -n scripts/test-source-integrity.sh
          bash -n scripts/check-toolchain.sh
          bash -n scripts/check-host.sh

      - name: Validate BareLinux configuration
        run: bash scripts/check-config.sh

      - name: Validate MLFS cross-toolchain policy
        run: bash scripts/check-toolchain.sh

      - name: Validate MLFS host prerequisites in an isolated Arch container
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            archlinux:latest \
            bash -euc 'sed -i "/^#\\[multilib\\]/,/^#Include =/s/^#//" /etc/pacman.conf; pacman -Sy --noconfirm --needed base-devel perl python texinfo lib32-glibc lib32-gcc-libs; bash scripts/check-host.sh'

      - name: Validate pinned source versions and integrity gate
        run: bash scripts/check-sources.sh

      - name: Test fail-closed source integrity behavior
        run: bash scripts/test-source-integrity.sh
